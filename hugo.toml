# aiaioli — the editorial layer (Hugo + texify3, vendored). Seam to the wiki = the footer link (for now).
baseURL = 'https://aiaioli.com/'   # Tish owns the domain; deploy via Cloudflare Pages (root: aiaioli-hugo)
languageCode = 'en'
title = 'aiaioli'
theme = 'hugo-texify3'
enableEmoji = true
enableRobotsTXT = true

[pagination]
  pagerSize = 10

[taxonomies]
  tags = 'tags'
  categories = 'categories'

[markup]
  [markup.goldmark.renderer]
    unsafe = true   # inline HTML — margin notes, the editor's strike-throughs
  [markup.goldmark.extensions.passthrough]
    enable = true   # let $…$ and \[…\] pass through to KaTeX (migrated from theme config)
    [markup.goldmark.extensions.passthrough.delimiters]
      block = [['$$', '$$'], ['\\[', '\\]']]
      inline = [['$', '$'], ['\\(', '\\)']]
  [markup.highlight]
    noClasses = false
  [markup.tableOfContents]
    startLevel = 2
    endLevel = 6
    ordered = false

[params]
  title = 'aiaioli'
  author = 'Tish'
  description = "nobody would fake evidence this stupid"
  keywords = ['knowledge graph', 'criticism', 'cartography', 'aiaioli']
  dateFormat = '2 January 2006'
  math = true
  toc = false
  rootFontSize = '105%'
  emphasisWithDots = false
  numberedSubtitles = false
  customCSS = ['css/custom.css']
  customJS = []
  # the seam: the one link back into the specimen (the Quartz wiki)
  footnote = 'the editor annotating the specimen · <a class="link" href="https://anti-tish.github.io/aiaioli-wiki/">↗ the wiki</a>'

[[menu.main]]
  name = 'posts'
  url = '/posts/'
  weight = 1
[[menu.main]]
  name = 'tags'
  url = '/tags/'
  weight = 2
