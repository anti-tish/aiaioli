# static/admin/config.yml — Sveltia CMS over aiaioli. Sibling of rpot's; see /Users/tish/brain/SVELTIA-SPIKE.md
#
# HARD INVARIANTS:
# - Sign in as anti-tish ONLY (pseudonym; never the account Gmail). Commits author as the
#   signed-in account.
# - Every published word on aiaioli is Tish's (the covenant). The CMS is her pen's surface —
#   no Claude drafts land here.
# - After any change to THIS file, reload open admin tabs — a stale tab keeps the old config.
backend:
  name: github
  repo: anti-tish/aiaioli
  branch: main # aiaioli deploys from main (rpot is master — the branch names differ, known quirk)
  commit_messages:
    create: "aiaioli: create {{slug}} (via cms)"
    update: "aiaioli: update {{slug}} (via cms)"
    delete: "aiaioli: delete {{slug}} (via cms)"
    uploadMedia: "aiaioli: upload {{path}} (via cms)"
    deleteMedia: "aiaioli: delete {{path}} (via cms)"

media_folder: static/uploads
public_folder: /uploads

collections:
  - name: posts
    label: Posts
    folder: content/posts
    create: true
    format: yaml-frontmatter
    slug: "{{slug}}"
    fields:
      - { name: title, label: Title, widget: string }
      - { name: date, label: Date, widget: datetime, format: "YYYY-MM-DDTHH:mm:ssZ" } # Hugo needs seconds+offset
      - { name: draft, label: Draft, widget: boolean, default: true, hint: "true = not rendered on the site, BUT this repo is PUBLIC — the file itself is readable on GitHub. Words that aren't ready to exist publicly stay in drafts/ (never pushed), not here." }
      - { name: tags, label: Tags, widget: list, required: false }
      - { name: body, label: Body, widget: markdown }
      # citation picker — each cite is a live wiki page PLUS Tish's own note on it (the margin gloss).
      # The node <options> between the wiki-cites markers are GENERATED by
      # /Users/tish/brain/cms-wiki-index.py (run after a wiki publish; don't hand-edit them).
      # inject() reads the marker line's indentation, so the generated lines nest correctly here.
      # "(unlisted)" = a live URL not in the sitemap; citing one gives it its first inbound link.
      - name: cites
        label: "Cites — wiki node + your note"
        label_singular: citation
        widget: list
        required: false
        collapsed: false
        summary: "{{fields.node}}"
        fields:
          - name: node
            label: Node (live wiki page)
            widget: select
